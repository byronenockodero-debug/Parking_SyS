{% extends "base.html" %}
{% block title %}Vehicle Entry{% endblock %}

{% block content %}
<div class="page-head">
    <h2>Vehicle Entry</h2>
    <!--
    A small live clock so the driver can see, in real time, exactly
    what moment will be recorded as their entry_time the instant they
    submit the form below. It's purely visual - the actual timestamp
    that gets saved is generated by Python (datetime.now()) on the
    server the moment the form is submitted, in logic/parking_lot.py.
    -->
    <div class="live-clock" id="live-clock"></div>
</div>

<form method="POST" class="parking-form">
    <label for="plate">Number Plate</label>
    <input type="text" id="plate" name="plate" placeholder="e.g. KDA 123A" required>
    <button type="submit">Enter Car Park</button>
</form>

{% if result %}
    <div class="result {{ 'success' if result.success else 'error' }}">
        <p>{{ result.message }}</p>
        {% if result.entry_time_display %}
            <p class="note">Recorded entry time: {{ result.entry_time_display }}</p>
        {% endif %}
    </div>
{% endif %}

<p><a href="{{ url_for('index') }}">&larr; Back to live display</a></p>
{% endblock %}
